name: build-release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # Pinned to the same version as rust-toolchain.toml so new lints in a
      # future stable release cannot break the build unexpectedly.
      - name: Install Rust 1.97.0 (+ clippy, rustfmt)
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Toolchain info
        run: rustc --version; cargo clippy --version

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit, architecture & plugin tests
        run: cargo test

      - name: Release build
        run: cargo build --release

      # The release exe uses the Windows GUI subsystem (no console), so wait
      # for the process explicitly and check its exit code. The smoke test
      # plays every mode of every registered game with its bot.
      - name: Headless smoke test (all registered games)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\target\release\VibeCodedGame.exe -ArgumentList '--smoke-test' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "smoke test failed with exit code $($p.ExitCode)" }
          Write-Host "smoke test passed (exit code 0)"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: VibeCodedGame-windows-x64
          path: target/release/VibeCodedGame.exe
          if-no-files-found: error

      - name: Publish GitHub release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/VibeCodedGame.exe
          generate_release_notes: true
